name: jakechal-llama-cpp
base: core24
version: '0.2'
summary: LLM inference in C/C++
description: |
  enable LLM (and VLM) inference with minimal setup and state-of-the-art
  performance on a wide range of hardware - locally and in the cloud.
grade: devel
confinement: strict

parts:
  build-deps:
    plugin: nil
    build-packages:
      - ninja-build
      - libssl-dev
  llama-cpp:
    source: https://github.com/ggml-org/llama.cpp.git
    source-commit: c1d0e7a004015f23bc0233470b747b596f29b264 # v0.3.0
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      - -DCMAKE_INSTALL_PREFIX=/usr
    stage-packages:
      - libgomp1
    organize:
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/*.so*: usr/lib/
    prime:
      - usr/bin/llama-cli
      - usr/lib/*.so*
      - -usr/lib/libllama-batched-bench*
      - -usr/lib/libllama-bench*
      - -usr/lib/libllama-completion*
      - -usr/lib/libllama-fit-params*
      - -usr/lib/libllama-perplexity*
      - -usr/lib/libllama-quantize*
apps:
  jakechal-llama-cpp:
    command: usr/bin/llama-cli
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib
    plugs:
      - network
      - network-bind
      - home
